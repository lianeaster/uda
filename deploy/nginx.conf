# Конфіг nginx. Копіювати в /etc/nginx/sites-available/uda й лінкувати:
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/uda
#   sudo ln -s /etc/nginx/sites-available/uda /etc/nginx/sites-enabled/uda
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Тут навмисно лише http. TLS додасть certbot --nginx: він сам допише блок
# 443, редирект з 80 і шляхи до сертифікатів, зберігши всі location нижче.
# Домени замінити на свої у двох місцях — server_name і DJANGO_ALLOWED_HOSTS.

upstream uda_app {
    server unix:/run/uda/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name uda.org.ua www.uda.org.ua;

    # Верхня межа завантаження. Фото профілю сюди вкладається з запасом;
    # підняти, коли зʼявляться великі файли.
    client_max_body_size 25m;

    # Статика, зібрана через collectstatic. Django її на проді не роздає.
    location /static/ {
        alias /srv/uda/staticfiles/;
        access_log off;
        expires 30d;
    }

    # Медіа — фото, які вантажать самі користувачі.
    # Саме цей блок піде геть, коли медіа переїде в бакет.
    location /media/ {
        alias /srv/uda/media/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://uda_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django читає саме цей заголовок, щоб знати про https
        # (SECURE_PROXY_SSL_HEADER у config/settings.py).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
