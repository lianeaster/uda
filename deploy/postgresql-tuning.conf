# Налаштування PostgreSQL під інстанс на 2 GB, де на тій самій машині
# живуть ще gunicorn і nginx. Типові значення розраховані на виділений
# сервер і тут залишили б забагато памʼяті за собою.
#
# Ставити так (у Debian 12 це PostgreSQL 15):
#   sudo cp deploy/postgresql-tuning.conf /etc/postgresql/15/main/conf.d/10-uda.conf
#   sudo systemctl restart postgresql
#
# Каталог conf.d підключений у postgresql.conf самим пакетом Debian,
# тож основний файл чіпати не треба.

# Скільки памʼяті Postgres тримає під свій кеш сторінок.
# Класична рекомендація — чверть RAM; з 2 GB це 512 МБ, але тут ще два
# сусіди, тож беремо половину від того.
shared_buffers = 256MB

# Не виділення памʼяті, а підказка планувальнику, скільки всього кешу
# (свого і файлового) реально доступно. Впливає на вибір індексів.
effective_cache_size = 768MB

# Памʼять на одну операцію сортування. Множиться на кількість паралельних
# запитів, тому на маленькій машині тримаємо скромно.
work_mem = 4MB
maintenance_work_mem = 64MB

# Типові 100 зʼєднань тут зайві: воркерів gunicorn лише 2, кожен тримає
# одне зʼєднання (CONN_MAX_AGE=60). Запас на admin і бекапи.
max_connections = 50

# Диск у Lightsail — SSD, тож випадкове читання коштує майже як послідовне.
# Типове значення 4.0 написане під шпиндельні диски й змушує планувальник
# уникати індексів там, де вони вигідні.
random_page_cost = 1.1

# Контрольні точки рідше й рівномірніше — менше стрибків запису.
checkpoint_completion_target = 0.9
