{% extends "platform_base.html" %}
{% block title %}Новий курс{% endblock %}
{% block content %}
<div class="container">
    <div class="form-page">
        <h1>Новий курс</h1>
        <form method="post">
            {% csrf_token %}
            <p>
                <label for="{{ form.name.id_for_label }}">{{ form.name.label }}</label>
                {{ form.name }}
                {{ form.name.errors }}
            </p>
            <button type="submit" class="btn" style="width:100%;">Зберегти</button>
        </form>
        <p style="text-align:center;margin-top:16px;"><a href="{% url 'schedule:course_list' %}">&larr; До списку курсів</a></p>
    </div>
</div>
{% endblock %}
