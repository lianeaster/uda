<a href="{% url 'schedule:student_edit' e.pk %}?next={{ request.get_full_path|urlencode }}">Редагувати</a>
<form class="inline-form" method="post" action="{% url 'schedule:student_delete' e.pk %}"
      onsubmit="return confirm('Прибрати {{ e.student.display_name|escapejs }} з групи «{{ e.group.name|escapejs }}»? Обліковий запис лишиться в «Користувачах».');">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit" class="link-button danger-link">Видалити</button>
</form>
