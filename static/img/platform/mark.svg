<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 2 62 57" width="62" height="57" role="img" aria-label="Навчальна платформа UFIC">
  <!-- Знак Навчальної платформи UFIC: з розгорнутої книги росте колос, довкола
       нього — сировина всіх напрямів обох академій. Фарби логотипа Центру.
       Без напису — для шапки й дрібних розмірів. -->
  <g fill="#39552d" stroke="#39552d" stroke-width="2" stroke-linejoin="round">
    <path d="M30 43.2C24 39.6 15.4 38.6 7 40.1v12.6c8.4-1.5 17-.5 23 3.3Z"/>
    <path d="M34 43.2C40 39.6 48.6 38.6 57 40.1v12.6c-8.4-1.5-17-.5-23 3.3Z"/>
  </g>
  <!-- колос: зерно, борошно, снеки, дистиляти -->
  <g fill="#39552d" transform="translate(32 15) scale(1.12)">
    <ellipse cx="0" cy="-6.6" rx="2.1" ry="3.7"/><ellipse cx="-3.3" cy="-1.3" rx="2.1" ry="3.7" transform="rotate(-32 -3.3 -1.3)"/><ellipse cx="3.3" cy="-1.3" rx="2.1" ry="3.7" transform="rotate(32 3.3 -1.3)"/><ellipse cx="-3.3" cy="4.3" rx="2.1" ry="3.7" transform="rotate(-32 -3.3 4.3)"/><ellipse cx="3.3" cy="4.3" rx="2.1" ry="3.7" transform="rotate(32 3.3 4.3)"/>
  </g>
  <path d="M32 12.5V40.5" stroke="#39552d" stroke-width="1.8" stroke-linecap="round"/>
  <!-- стільник: мед -->
  <g transform="translate(8.6 31.2) rotate(-8)">
    <polygon points="0.00,-5.50 4.76,-2.75 4.76,2.75 0.00,5.50 -4.76,2.75 -4.76,-2.75" fill="#fcb040" stroke="#fcb040" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="0.00,-2.31 2.00,-1.16 2.00,1.15 0.00,2.31 -2.00,1.16 -2.00,-1.16" fill="#ffffff"/>
  </g>
  <!-- крапля: напої, олії, дистиляти -->
  <g transform="translate(19.4 20.2) rotate(-14) scale(0.86)">
    <path d="M0-10.5C4.6-4.3 7-.6 7 3a7 7 0 0 1-14 0C-7-.6-4.6-4.3 0-10.5Z" fill="#0f75bd"/>
    <circle cx="-2.6" cy="3.6" r="1.7" fill="#ffffff"/>
  </g>
  <!-- плід: ягоди й овочі — соуси, ферментація, суперфуди -->
  <g transform="translate(44.6 21.2)">
    <circle cy="1.2" r="5.4" fill="#fcb040"/>
    <path d="M0-3.7C.3-7.1 2.8-8.7 5.8-8.4 5.6-5.4 3.3-3.5 0-3.700Z" fill="#39552d"/>
  </g>
  <!-- листок: трави й ботаніка -->
  <g transform="translate(55.6 30.6) rotate(24) scale(.72)">
    <path d="M0 9.5C-7.5 4-7.5-4.5 0-10 7.5-4.5 7.5 4 0 9.5Z" fill="#39552d"/>
    <path d="M0 9.5V-3.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>
