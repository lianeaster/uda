<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Навчальна платформа UFIC">
  <!-- Плитковий знак: джерело для фавіконів. У 16–32 px п'ять символів
       зливаються, тож тут книга, колос, стільник і крапля. Плитка квадратна,
       а не кругла — щоб у вкладках не плутатися зі знаком Центру. -->
  <rect width="64" height="64" rx="15" fill="#39552d"/>
  <g transform="translate(32 33.5) scale(.86) translate(-32 -32)">
    <g fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round">
      <path d="M30 43.2C24 39.6 15.4 38.6 7 40.1v12.6c8.4-1.5 17-.5 23 3.3Z"/>
      <path d="M34 43.2C40 39.6 48.6 38.6 57 40.1v12.6c-8.4-1.5-17-.5-23 3.3Z"/>
    </g>
    <!-- колос: зерно, борошно, снеки, дистиляти -->
    <g fill="#ffffff" transform="translate(32 15) scale(1.12)">
      <ellipse cx="0" cy="-6.6" rx="2.1" ry="3.7"/><ellipse cx="-3.3" cy="-1.3" rx="2.1" ry="3.7" transform="rotate(-32 -3.3 -1.3)"/><ellipse cx="3.3" cy="-1.3" rx="2.1" ry="3.7" transform="rotate(32 3.3 -1.3)"/><ellipse cx="-3.3" cy="4.3" rx="2.1" ry="3.7" transform="rotate(-32 -3.3 4.3)"/><ellipse cx="3.3" cy="4.3" rx="2.1" ry="3.7" transform="rotate(32 3.3 4.3)"/>
    </g>
    <path d="M32 12.5V40.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <!-- стільник: мед -->
    <g transform="translate(13 25.5) rotate(-8)">
      <polygon points="0.00,-6.60 5.72,-3.30 5.72,3.30 0.00,6.60 -5.72,3.30 -5.72,-3.30" fill="#fcb040" stroke="#fcb040" stroke-width="1.2" stroke-linejoin="round"/>
      <polygon points="0.00,-2.77 2.40,-1.39 2.40,1.39 0.00,2.77 -2.40,1.39 -2.40,-1.39" fill="#39552d"/>
    </g>
    <!-- крапля: напої, олії, дистиляти -->
    <g transform="translate(51 25) rotate(10) scale(1)">
      <path d="M0-10.5C4.6-4.3 7-.6 7 3a7 7 0 0 1-14 0C-7-.6-4.6-4.3 0-10.5Z" fill="#0f75bd"/>
      <circle cx="-2.6" cy="3.6" r="1.7" fill="#39552d"/>
    </g>
  </g>
</svg>
